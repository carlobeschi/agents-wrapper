<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainstorm</title>
<style>
  :root { --bg:#faf9f6; --card:#fff; --ink:#1f1e1c; --mute:#6b6862; --line:#e4e1da; --accent:#d97757; --ok:#2f7d4f; --bad:#b3402e; --soft:#f3efe8; --warn:#b07d00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191817; --card:#22211f; --ink:#ece9e3; --mute:#a39f97; --line:#3a3835; --soft:#2b2a27; --ok:#5cb37f; --bad:#e0705c; --warn:#e0b03c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; } header span { color:var(--mute); font-size:13px; }
  main { display:grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 50px); }
  aside { border-right:1px solid var(--line); padding:14px; }
  aside button.new { width:100%; margin-bottom:12px; }
  .runlink { display:block; width:100%; text-align:left; padding:8px; border-radius:8px; margin-bottom:4px; background:none; border:1px solid transparent; color:inherit; cursor:pointer; font-size:13px; }
  .runlink:hover, .runlink.on { background:var(--soft); border-color:var(--line); }
  .runlink small { color:var(--mute); display:block; }
  .runlink .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--accent); vertical-align:1px; }
  .runlink .dot.done { background:var(--ok); } .runlink .dot.failed, .runlink .dot.stopped { background:var(--bad); }
  section#view { padding:20px 28px; max-width: 1200px; min-width:0; }
  label { display:block; font-weight:600; margin:14px 0 6px; } label small { font-weight:400; color:var(--mute); }
  textarea, select, input[type=text], input[type=number] { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; }
  textarea { min-height:140px; resize:vertical; }
  input[type=number] { width:90px; }
  select { width:auto; max-width:100%; }
  .row { display:flex; gap:28px; flex-wrap:wrap; }
  .agents { display:flex; gap:10px; flex-wrap:wrap; }
  .agent { border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--card); display:flex; gap:8px; align-items:center; }
  .agent.off { opacity:.5; } .agent small { color:var(--mute); }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  button.link { background:none; border:none; padding:0; color:var(--accent); text-decoration:underline; font-size:13px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .actions { margin-top:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .msg { color:var(--bad); } .note { color:var(--mute); font-size:13px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  h2 { font-size:16px; margin:26px 0 10px; }
  .problem { white-space:pre-wrap; background:var(--soft); padding:10px 12px; border-radius:8px; overflow-wrap:anywhere; }
  pre { white-space:pre-wrap; word-break:break-word; font:12px/1.45 ui-monospace, Menlo, monospace; background:var(--soft); padding:8px; border-radius:6px; max-height:320px; overflow:auto; margin:6px 0 0; }
  details summary { cursor:pointer; color:var(--mute); font-size:13px; margin-top:6px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }

  /* ---- Run header ---- */
  .runhead .titlerow { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
  .runhead .title { margin:2px 0 0; font-size:20px; line-height:1.3; overflow-wrap:anywhere; }
  .runhead .stop { flex:none; font-size:13px; padding:6px 12px; color:var(--bad); }
  .about .problem { margin-top:8px; max-height:340px; overflow:auto; }
  .settings { margin:8px 0 0; padding-left:18px; overflow-wrap:anywhere; }

  /* ---- Progress strip ---- */
  .phases { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 8px; padding:8px 0; }
  .ph { position:relative; overflow:hidden; display:inline-flex; align-items:baseline; gap:6px; padding:5px 12px 7px; border-radius:999px; border:1px solid var(--line); font-size:13px; color:var(--mute); background:var(--card); }
  .ph small { font-size:11px; font-weight:400; opacity:.9; }
  .ph .bar { position:absolute; left:0; bottom:0; height:3px; background:currentColor; opacity:.45; }
  .ph.now { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .ph.now .ic { animation:pulse 1.4s ease-in-out infinite; }
  .ph.past { color:var(--ok); border-color:var(--ok); }
  .ph.halt { color:var(--bad); border-color:var(--bad); font-weight:600; }
  .ph.wait { border-style:dashed; }
  .ph:disabled { opacity:.75; }
  @keyframes pulse { 50% { opacity:.3; } }
  .status { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .headline { margin:0 0 6px; font-weight:600; }
  .who { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  .who li { display:grid; grid-template-columns: 10px minmax(80px, max-content) minmax(0, 1fr); gap:2px 10px; align-items:center; font-size:13px; }
  .who .dot { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .who .running .dot { background:var(--accent); animation:pulse 1.4s ease-in-out infinite; }
  .who .done .dot { background:var(--ok); } .who .failed .dot { background:var(--bad); }
  .who .failed .what { color:var(--bad); }
  .who .line, .who .budget { grid-column:3; }
  .who .line { color:var(--mute); font:12px/1.4 ui-monospace, Menlo, monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .budget { height:4px; background:var(--soft); border-radius:2px; overflow:hidden; max-width:320px; }
  .who .budget i { display:block; height:100%; background:var(--accent); }
  @media (prefers-reduced-motion: reduce) { .ph.now .ic, .who .running .dot { animation:none; } }

  /* ---- Sections ---- */
  .sec { scroll-margin-top:64px; }
  .sec > h2 { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; font-size:18px; margin:30px 0 10px; padding-top:14px; border-top:1px solid var(--line); }
  .sec > h2 .n, #file h2 .n { font-size:13px; color:var(--mute); font-weight:400; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  .card.is-running { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .card.is-failed { border-color:color-mix(in srgb, var(--bad) 55%, var(--line)); }
  .card h3, .bh h3 { margin:0 0 6px; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .st { font-size:12px; font-weight:500; color:var(--mute); white-space:nowrap; } .st.running { color:var(--accent); } .st.done { color:var(--ok); } .st.failed { color:var(--bad); white-space:normal; }
  pre.tail { max-height:none; overflow:hidden; }
  details.raw > summary, details.log > summary { font-size:12px; }

  /* ---- The result ---- */
  .wins { display:grid; gap:10px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .wincard { display:flex; gap:12px; background:color-mix(in srgb, var(--accent) 8%, var(--card)); border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:10px; padding:12px 14px; }
  .wincard > div { min-width:0; }
  .wincard .num { flex:none; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:13px; }
  .wincard b { font-size:15px; }
  .wincard p { margin:6px 0 0; font-size:14px; }
  .buildsum { margin-top:12px; display:grid; gap:6px; }
  .bs { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .bs .teaser { flex-basis:100%; font-size:13px; }

  /* ---- Research ---- */
  .surprise { background:color-mix(in srgb, var(--warn) 14%, var(--card)); border-left:3px solid var(--warn); padding:8px 10px; border-radius:6px; font-size:14px; margin:4px 0 8px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--warn); margin-right:6px; }
  ol.finds { margin:6px 0 0; padding-left:20px; font-size:14px; } ol.finds li { margin:0 0 8px; }
  .src { display:block; color:var(--mute); font-size:12px; overflow-wrap:anywhere; } .src a { color:inherit; }

  /* ---- Ideas ---- */
  .idea { margin:10px 0 0; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .idea:last-child { border-bottom:none; padding-bottom:0; }
  .idea b { display:block; font-size:15px; }
  .idea p { margin:4px 0 0; font-size:14px; }
  .idea .why { color:var(--mute); font-style:italic; font-size:13px; }
  .idea.win { border-left:3px solid var(--accent); padding-left:10px; }
  .badge { display:inline-block; font-size:11px; font-weight:600; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:0 8px; }

  /* ---- Vote ---- */
  .voters { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .voters span { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:2px 10px; background:var(--card); }
  .voters .is-failed { color:var(--bad); border-color:var(--bad); }
  .scrollx { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .scrollx.stack { border:1px solid var(--line); border-radius:10px; background:var(--card); }
  table.vote th { font-size:12px; color:var(--mute); font-weight:600; white-space:nowrap; position:sticky; top:0; }
  table.vote td.name { min-width:220px; max-width:360px; }
  table.vote td.sc { min-width:130px; max-width:220px; }
  table.vote td.rank { white-space:nowrap; font-weight:600; }
  table.vote td.avg { white-space:nowrap; }
  table.vote tbody tr:last-child td { border-bottom:none; }
  tr.win td { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  td .t { font-weight:600; }
  td .by { display:block; color:var(--mute); font-size:12px; }
  td .what { font-size:13px; margin-top:4px; }
  .meter { display:inline-block; vertical-align:middle; width:48px; height:5px; background:var(--soft); border-radius:3px; margin:0 6px; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--accent); }
  .score { display:inline-block; min-width:28px; text-align:center; border-radius:6px; padding:0 6px; }
  .score.hi { background:color-mix(in srgb, var(--ok) 20%, transparent); } .score.mid { background:color-mix(in srgb, var(--warn) 18%, transparent); } .score.lo { background:color-mix(in srgb, var(--bad) 18%, transparent); }
  .cs { color:var(--mute); }
  td .why { color:var(--mute); font-size:12px; margin-top:2px; }
  details.why > summary { list-style:none; margin:2px 0 0; font-size:12px; }
  details.why > summary::-webkit-details-marker { display:none; }
  details.why:not([open]) > summary .s { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  details.why > summary:hover .s { color:var(--ink); }
  details.why .l { display:none; text-decoration:underline; }
  details.why.crit[open] > summary .s { display:none; } details.why.crit[open] > summary .l { display:inline; }
  details.why ul { margin:4px 0 0; padding-left:16px; } details.why li { margin-bottom:4px; }

  /* ---- Build: side by side ---- */
  .compare { display:grid; grid-template-columns: repeat(var(--n), minmax(280px, 1fr)); column-gap:12px; }
  .compare > .cell { background:var(--card); border-left:1px solid var(--line); border-right:1px solid var(--line); padding:4px 14px; min-width:0; }
  .compare > .cell.first { border-top:1px solid var(--line); border-radius:10px 10px 0 0; padding-top:12px; }
  .compare > .cell.last { border-bottom:1px solid var(--line); border-radius:0 0 10px 10px; padding-bottom:12px; }
  .compare > .cell.first.last { border-radius:10px; }
  .bh { scroll-margin-top:64px; }
  details.blk { margin:6px 0; }
  details.blk > summary { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--mute); margin:0; }
  .txt { white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; margin-top:4px; }
  details.blk.nd .txt { background:color-mix(in srgb, var(--bad) 8%, transparent); padding:6px 8px; border-radius:6px; }
  details.blk.nothing .txt { color:var(--ok); }
  .files div { font-size:13px; overflow-wrap:anywhere; margin:2px 0; }
  .files small { color:var(--mute); }
  .files a { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .files a + small + a { margin-left:10px; font-size:12px; }
  .more .path { overflow-wrap:anywhere; margin-top:6px; font-size:12px; }

  /* ---- File viewer ---- */
  #file { scroll-margin-top:64px; }
  #file .panes { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:12px; }
  .pane { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:10px; min-width:0; }
  .pane .bar2 { display:flex; justify-content:space-between; gap:8px; align-items:center; font-size:13px; }
  .pane .bar2 b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pane button { padding:2px 10px; font-size:12px; flex:none; }
  #file pre { max-height:600px; }

  /* ---- Phones ---- */
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    aside { border-right:none; border-bottom:1px solid var(--line); }
    #runs { max-height:30vh; overflow:auto; }
    section#view { padding:16px; }
    .runhead .title { font-size:18px; }
    .phases { position:static; flex-direction:column; gap:4px; }
    .ph { display:flex; width:100%; border-radius:8px; text-align:left; }
    .ph small { margin-left:auto; }
    .who li { grid-template-columns: 10px minmax(0, 1fr); }
    .who .what, .who .line, .who .budget { grid-column:2; }
    .cards { grid-template-columns: 1fr; }
    .compare { grid-template-columns: minmax(0, 1fr); }
    .compare > .cell { order:var(--o); }
    .compare > .cell.last { margin-bottom:12px; }
    .sec, .bh, #file { scroll-margin-top:8px; }
  }
  @media (max-width: 640px) {
    .scrollx.stack { border:none; background:none; overflow:visible; }
    table.vote, table.vote tbody, table.vote tr, table.vote td { display:block; width:auto; }
    table.vote thead { display:none; }
    table.vote tr { border:1px solid var(--line); border-radius:10px; margin-bottom:10px; background:var(--card); overflow:hidden; padding:6px 0; }
    table.vote td { border:none; padding:3px 12px; min-width:0; max-width:none; }
    table.vote td.rank::before { content:'#'; }
    table.vote td.avg, table.vote td.sc { display:grid; grid-template-columns: 90px minmax(0, 1fr); gap:8px; white-space:normal; }
    table.vote td.avg::before, table.vote td.sc::before { content:attr(data-label); color:var(--mute); font-size:12px; overflow:hidden; text-overflow:ellipsis; }
  }
  /* The person's own look, the agents' rooms, the adjusted score */
  label.check { display:flex; gap:8px; align-items:baseline; font-weight:normal; margin-top:14px; }
  label.check small { flex-basis:100%; }
  .room { display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; grid-column: 2 / -1; }
  .rt { font-size:11px; border:1px solid var(--line); border-radius:9px; padding:0 7px; color:var(--mute); white-space:nowrap; }
  .rt.yes { color:var(--ok); } .rt.no { color:var(--bad); } .rt.warn { color:var(--warn); }
  small.adj { display:block; color:var(--mute); }
  .mypick { background:var(--soft); border-radius:8px; padding:10px 12px; margin:10px 0; }
  .cards.one { grid-template-columns:1fr; }
  label.idea.pick { display:flex; gap:10px; align-items:flex-start; font-weight:normal; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:0; }
  label.idea.pick input { margin-top:4px; }
  table.rate { border-collapse:collapse; width:100%; }
  table.rate th, table.rate td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; font-size:13px; }
  table.rate td select { margin-right:6px; }
  table.rate td input, .reports input { width:auto; min-width:120px; max-width:100%; }
  .reports > div { margin:6px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  @media (max-width:640px) { table.rate thead { display:none; } table.rate tr, table.rate th, table.rate td { display:block; border:0; padding:4px 0; } table.rate tr { border-bottom:1px solid var(--line); padding:8px 0; } }
</style>
</head>
<body>
<header><h1>Brainstorm</h1><span>agents propose ideas, vote on each other's without names, then each builds the winners</span></header>
<main>
  <aside>
    <button class="new" id="new">New brainstorm</button>
    <div id="runs"></div>
  </aside>
  <section id="view"></section>
</main>
<div id="announce" class="sr" role="status" aria-live="polite"></div>
<script src="/page.js"></script>
</body>
</html>
