# GitHub Action for a goal repository (copy to .github/workflows/goal-agent.yml
# in the goal's own private repo). It lets the agent answer without anyone's
# laptop: when a member opens or edits an issue, and once a day, it turns new
# issues from members into inputs, runs the agent once, and commits the result
# (plan, answers, STATUS.md, page) to the goal repo. It reads issues; it never
# comments, closes or posts anywhere else.
#
# Needs one repository secret, ANTHROPIC_API_KEY, set by the owner in the repo's
# Settings > Secrets and variables > Actions. Never paste the key anywhere else.
name: goal-agent
on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: goal-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: carlobeschi/agents-wrapper
          path: .agents-wrapper
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Issues from members become inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .agents-wrapper/goal.js pull . --repo "${{ github.repository }}"
      - name: The agent's turn
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .agents-wrapper/goal.js run .
      - name: Commit
        run: |
          rm -rf .agents-wrapper
          git config user.name goal-agent
          git config user.email goal-agent@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "agent: run" && git push
