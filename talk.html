<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents talk</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #fff; --side: #efefeb; --text: #1d1d1b; --muted: #6b6b66; --line: #e0e0da;
    --accent: #2f5bd3; --ok: #237a3b; --bad: #b3261e; --run: #a86b00;
    --a: #eef2fd; --a-dot: #3d63d6; --b: #eef6ea; --b-dot: #2f8a4a; --you: #fbf3e2; --you-dot: #b07a12;
    --code: #f0f0ec;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1d; --side: #1a1a19; --text: #ececea; --muted: #9a9a94; --line: #30302c;
            --accent: #7c9cff; --ok: #6cc785; --bad: #ff8a80; --run: #e8b04a;
            --a: #1d2436; --a-dot: #7c9cff; --b: #1c281d; --b-dot: #6cc785; --you: #2c2617; --you-dot: #e8b04a;
            --code: #262624; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 270px 1fr; }
  [hidden] { display: none !important; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           cursor: pointer; font: inherit; font-size: 14px; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .icon { padding: 6px 10px; }
  select, input[type=number], input[type=text], textarea {
    padding: 8px 10px; font: inherit; font-size: 14px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad) !important; }

  /* Sidebar: conversations */
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh;
          position: sticky; top: 0; }
  aside .top { padding: 16px 14px 10px; display: flex; flex-direction: column; gap: 12px; }
  aside .brand { font-weight: 700; font-size: 15px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .modes a { padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--muted); text-decoration: none; }
  .modes a:hover { color: var(--text); }
  .modes a.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
  #talks { flex: 1; overflow: auto; padding: 0 8px; }
  .talk { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 2px; }
  .talk:hover { background: var(--panel); }
  .talk.on { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .talk .t1 { display: flex; gap: 6px; align-items: center; font-weight: 600; }
  .talk .t2 { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.running { background: var(--run); animation: pulse 1.2s infinite; } .dot.done { background: var(--ok); }
  .dot.failed { background: var(--bad); }
  aside .bottom { padding: 10px 14px 14px; border-top: 1px solid var(--line); font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
  aside .bottom a { color: var(--muted); }
  #saved { overflow-wrap: anywhere; }
  .hint { font-size: 12px; color: var(--muted); padding: 4px 10px; }

  /* Main */
  main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .menu { display: none; }

  #setup { max-width: 640px; width: 100%; margin: 8vh auto 0; padding: 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h1 { font-size: 18px; margin: 0 0 16px; }
  .answer { margin-top: 8px; font-size: 13px; }
  .answer summary { cursor: pointer; color: var(--muted); }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .pair label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .pair select { width: 100%; }
  #swap { margin-top: 18px; }
  #opener { width: 100%; min-height: 140px; margin-top: 14px; resize: vertical; line-height: 1.5; }
  .go { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 12px; }
  .go label { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  input[type=number] { width: 72px; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .files:empty { display: none; }
  #openerFiles { margin-top: 8px; }
  #controls .files { max-width: 820px; margin: 0 auto 8px; }
  .chip { font-size: 12px; padding: 2px 4px 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
  .chip button { border: 0; background: none; padding: 0 6px; color: inherit; }
  .att { margin-top: 6px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  #msg { margin-top: 10px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }

  #view { display: flex; flex-direction: column; flex: 1; min-height: 100vh; }
  header.bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line);
               background: var(--bg); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header.bar .who { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .s-running { color: var(--run); } .s-done { color: var(--ok); } .s-failed { color: var(--bad); } .s-stopped { color: var(--muted); }
  #progress { font-size: 13px; color: var(--muted); }
  header.bar .sp { flex: 1; }

  #chat { max-width: 820px; width: 100%; margin: 0 auto; padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .m { display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
  .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
  .m.a .av { background: var(--a-dot); } .m.b .av { background: var(--b-dot); } .m.you .av { background: var(--you-dot); }
  .m.opener .av { background: var(--muted); }
  .m .body { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; }
  .m.a .body { background: var(--a); } .m.b .body { background: var(--b); } .m.you .body { background: var(--you); }
  .m .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; gap: 8px; align-items: baseline; }
  .m .who b { color: var(--text); font-size: 13px; }
  .m.live .body { border-style: dashed; }
  .text { overflow-wrap: anywhere; }
  .text > :first-child { margin-top: 0; } .text > :last-child { margin-bottom: 0; }
  .text p, .text ul, .text ol, .text pre, .text blockquote { margin: 0 0 .6em; }
  .text ul, .text ol { padding-left: 1.4em; }
  .text h4 { margin: .8em 0 .3em; font-size: 15px; }
  .text code { background: var(--code); padding: 1px 4px; border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; }
  .text pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow: auto; }
  .text pre code { background: none; padding: 0; }
  .text blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .typing { display: inline-flex; gap: 3px; } .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--run); animation: pulse 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  #status { max-width: 820px; width: 100%; margin: 0 auto; padding: 0 20px 8px 62px; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  #controls { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 20%); padding: 12px 20px 16px; }
  #controls .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  #say { flex: 1; min-width: 0; }
  #more { display: inline-flex; gap: 6px; align-items: center; }
  #moreTurns { width: 60px; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
    body.nav aside { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.3); }
    .menu { display: inline-block; }
    #setup .menu { margin-bottom: 12px; }
    #status { padding-left: 20px; }
    #controls .row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<aside>
  <div class="top">
    <div class="brand">Agents</div>
  <nav class="modes" aria-label="Scenario">
    <a href="/" data-kind="talk">Conversation</a><a href="/story" data-kind="story">Story</a><a href="/puzzle" data-kind="puzzle">Puzzles</a><a href="/review" data-kind="review">Review</a>
  </nav>
    <button id="new" type="button">+ New conversation</button>
  </div>
  <div id="talks"><div class="hint">No conversations yet.</div></div>
  <div class="bottom">
    <button id="clear" type="button" hidden>Save and clear</button>
    <div id="saved" class="muted"></div>
    <a href="/dispatch">Dispatch (legacy)</a>
  </div>
</aside>

<main>
  <section id="setup">
    <button class="menu icon" type="button" aria-label="Conversations">☰</button>
    <div class="card">
      <h1 id="h1">New conversation</h1>
      <div class="pair">
        <label><span id="firstLabel">Speaks first</span> <select id="a"></select></label>
        <button class="icon" id="swap" type="button" title="Swap">⇄</button>
        <label><span id="secondLabel">Replies</span> <select id="b"></select></label>
      </div>
      <textarea id="opener" placeholder="Introduce them, or give a topic"></textarea>
      <div class="files" id="openerFiles"></div>
      <div class="go">
        <label><span id="countLabel">Turns</span> <input type="number" id="turns" min="1" max="50" value="10"></label>
        <span style="flex:1"></span>
        <button id="attachOpener" type="button" data-for="opener">Attach files</button>
        <button class="primary" id="start" type="button">Start <small>⌘↵</small></button>
      </div>
      <div id="msg"></div>
    </div>
  </section>

  <section id="view" hidden>
    <header class="bar">
      <button class="menu icon" type="button" aria-label="Conversations">☰</button>
      <span class="who" id="pair"></span>
      <span class="pill" id="pill"></span>
      <span id="progress"></span>
      <span class="sp"></span>
      <button id="copy" type="button">Copy transcript</button>
    </header>
    <div id="chat"></div>
    <div id="status"></div>
    <div id="controls">
      <div class="files" id="sayFiles"></div>
      <div class="row">
        <input type="text" id="say" placeholder="Say something to both">
        <button id="attachSay" type="button" data-for="say" title="Attach files" aria-label="Attach files">📎</button>
        <button id="send" type="button">Send</button>
        <button id="stop" type="button">Stop</button>
        <span id="more" hidden><button id="resume" type="button">Continue</button><input type="number" id="moreTurns" min="1" max="50" value="2" aria-label="More turns"></span>
      </div>
    </div>
  </section>
</main>

<input type="file" id="pick" multiple hidden>

<script>
// The key comes in the link npm start prints (#k=…) and is kept for this origin.
const TOKEN = (() => {
  const m = location.hash.match(/^#k=([0-9a-f]+)$/);
  try {
    if (m) { localStorage.setItem('agents.key', m[1]); history.replaceState(null, '', location.pathname + location.search); }
    return localStorage.getItem('agents.key') || (m ? m[1] : '');
  } catch { return m ? m[1] : ''; }
})();
const $ = id => document.getElementById(id);
// One page, three scenarios, picked by the path. Each keeps its own setup and list.
const KIND = { '/review': 'review', '/puzzle': 'puzzle' }[location.pathname] || 'talk';
const MODE = {
  talk:   { title: 'Conversation', h1: 'New conversation', first: 'Speaks first', second: 'Replies', count: 'Turns', turns: 10, min: 1, max: 50,
            placeholder: 'Introduce them, or give a topic', none: 'No conversations yet.' },
  review: { title: 'Review', h1: 'New review', first: 'Reviews first', second: 'Reviews second', count: 'Turns', turns: 6, min: 3, max: 50,
            placeholder: 'What to review and what the change is for. Paste a diff, or attach the files.', none: 'No reviews yet.' },
  puzzle: { title: 'Puzzles', h1: 'New puzzle game', first: 'Sets first', second: 'Solves first', count: 'Rounds', turns: 6, min: 1, max: 16,
            placeholder: 'Optional: a theme or rules, e.g. logic puzzles only', none: 'No games yet.' },
}[KIND];
const store = {
  get(k, d) { try { const v = localStorage.getItem(key(k)); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(key(k), JSON.stringify(v)); } catch {} },
};
function key(k) { return 'talk.' + (KIND === 'talk' || k === 'pair' ? k : `${KIND}.${k}`); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Attachments: picked here, sent as base64, checked and saved by the server
// into the conversation's files/ folder. The server's list of types decides;
// `accept` only narrows the picker.
const ACCEPT = 'txt md markdown csv tsv json yaml yml xml html css log js mjs cjs ts tsx jsx py rb go rs java kt swift c h cpp cs php sql sh pdf png jpg jpeg gif webp';
const picked = { opener: [], say: [] };
let picking = null;
const kb = n => n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1024 / 1024).toFixed(1)} MB`;
function chips(which) {
  $(which + 'Files').innerHTML = picked[which].map((f, i) =>
    `<span class="chip">${esc(f.name)} · ${kb(f.size)}<button type="button" data-for="${which}" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button></span>`).join('');
}
const b64 = f => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => no(r.error);
  r.readAsDataURL(f);
});
const encode = which => Promise.all(picked[which].map(async f => ({ name: f.name, data: await b64(f) })));
const att = files => files?.length
  ? `<div class="att">📎 ${files.map(f => `${esc(f.path)} · ${kb(f.size)}`).join(', ')}</div>` : '';
const withFiles = (text, files) => files?.length ? `${text}\n\nAttached: ${files.map(f => f.path).join(', ')}`.trim() : text;

// The Markdown agents write: paragraphs, headings, lists, quotes, code. Every
// piece of text goes through esc(), so a reply can never become HTML. Links stay text.
function inline(s) {
  return String(s).split(/(`[^`\n]+`)/).map((p, i) => i % 2 ? `<code>${esc(p.slice(1, -1))}</code>`
    : esc(p).replace(/\*\*(\S(?:.*?\S)?)\*\*/g, '<strong>$1</strong>')
            .replace(/(^|[\s(])[*_](\S(?:.*?\S)?)[*_](?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')).join('');
}
function md(src) {
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n'), out = [];
  let para = [];
  const flush = () => { if (para.length) out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      flush();
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
    } else if (/^#{1,6}\s/.test(l)) {
      flush(); out.push(`<h4>${inline(l.replace(/^#+\s*/, ''))}</h4>`);
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      flush();
      const ordered = /^\s*\d/.test(l), re = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/, items = [];
      for (; i < lines.length && re.test(lines[i]); i++) items.push(`<li>${inline(lines[i].replace(re, ''))}</li>`);
      i--;
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
    } else if (/^>\s?/.test(l)) {
      flush();
      const q = [];
      for (; i < lines.length && /^>\s?/.test(lines[i]); i++) q.push(inline(lines[i].replace(/^>\s?/, '')));
      i--;
      out.push(`<blockquote>${q.join('<br>')}</blockquote>`);
    } else if (!l.trim()) flush();
    else para.push(l);
  }
  flush();
  return out.join('');
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Dispatch-Token': TOKEN, 'Content-Type': 'application/json' },
    body: body && JSON.stringify(body),
  });
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || res.status);
  return out;
}

let current = null, timer = null, last = null;

function msg(text, err) { $('msg').textContent = text; $('msg').className = err ? 'err' : ''; }

const initials = label => (label.match(/\b[A-Za-z0-9]/g) || ['?']).slice(0, 2).join('').toUpperCase();

function message(cls, who, html, extra = '', avatar = initials(who)) {
  return `<div class="m ${cls}"><div class="av" aria-hidden="true">${esc(avatar)}</div>`
    + `<div class="body"><div class="who"><b>${esc(who)}</b>${extra}</div><div class="text">${html}</div></div></div>`;
}

// A puzzle round's step, and once graded, its verdict and the setter's answer.
const stepNote = m => m.step ? `<span>round ${m.round} · ${m.step}${m.step === 'grade' && m.solved != null ? (m.solved ? ' · solved' : ' · not solved') : ''}</span>` : '';
const answer = m => m.answer ? `<details class="answer"><summary>Answer</summary><div class="text">${md(m.answer)}</div></details>`
  : m.hidden ? '<div class="answer muted">Answer hidden until graded.</div>' : '';

function render(t) {
  last = t;
  const side = id => (id === t.agents[0].id ? 'a' : 'b');
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
  $('chat').innerHTML = [
    message('opener', 'Opener', md(t.opener) + att(t.files), '', '✎'),
    ...t.turns.map(m => m.user ? message('you', m.label, md(m.text) + att(m.files))
                               : message(side(m.agent), m.label, md(m.text) + answer(m), `${stepNote(m)}<span>${m.seconds}s</span>`)),
    ...t.queued.map(text => message('you', 'You', md(text), '<span>after this reply</span>')),
    t.current ? message(`${side(t.current.agent)} live`, t.current.label,
      t.current.text.trim() ? md(t.current.text) : '<span class="typing"><i></i><i></i><i></i></span>',
      `${stepNote(t.current)}<span class="s-running">${t.current.retry ? 'retrying' : 'writing'} · ${t.current.seconds}s</span>`) : '',
  ].join('');
  const spoken = t.turns.filter(m => m.agent).length;
  const running = t.status === 'running';
  $('pair').innerHTML = t.agents.map(a => esc(a.label)).join(' <span class="muted">↔</span> ');
  $('pill').textContent = t.status;
  $('pill').className = `pill s-${t.status}`;
  $('progress').textContent = t.kind === 'puzzle'
    ? `round ${Math.min(t.rounds, Math.floor(spoken / 3) + (running ? 1 : 0)) || 1} of ${t.rounds} · solved ${t.agents.map((a, i) => `${a.label} ${t.score[i]}`).join(', ')}`
    : running ? `turn ${spoken + 1} of ${spoken + t.turnsLeft}` : `${spoken} turn${spoken === 1 ? '' : 's'}`;
  $('status').innerHTML = `<span class="s-${esc(t.status)}">${esc(t.status)}</span> · ${spoken} turn${spoken === 1 ? '' : 's'}`
    + (running ? ` · ${t.turnsLeft} to go` : '') + ` · ${esc(t.dir)}`
    + (t.error ? `\n<span class="err">${esc(t.error)}</span>` : '');
  $('stop').hidden = !running;
  $('more').hidden = running;
  $('resume').textContent = t.status === 'failed' ? 'Retry' : 'Continue';
  document.title = `${t.agents.map(a => a.label).join(' ↔ ')} · ${MODE.title}`;
  if (nearBottom) window.scrollTo(0, document.body.scrollHeight);
}

function transcript(t) {
  return [`# ${t.agents.map(a => a.label).join(' ↔ ')}`, '', '## Opener', '', withFiles(t.opener, t.files), '',
    ...t.turns.flatMap(m => [`## ${m.label}${m.step ? ` (round ${m.round}, ${m.step})` : ''}`, '',
      withFiles(m.answer ? `${m.text}\n\n**Answer**\n\n${m.answer}` : m.text, m.files), ''])].join('\n');
}

async function show(id) {
  clearTimeout(timer);
  let t;
  try { t = await api(`/api/talk?id=${encodeURIComponent(id)}`); }
  catch { store.set('current', null); return showSetup(); }
  const switched = current !== id;
  current = id; store.set('current', id);
  $('setup').hidden = true; $('view').hidden = false;
  document.body.classList.remove('nav');
  render(t);
  if (switched) { window.scrollTo(0, document.body.scrollHeight); markActive(); }
  if (t.status === 'running') timer = setTimeout(() => show(id), 1000);
  else refreshTalks();
}

function showSetup() {
  clearTimeout(timer);
  current = null; store.set('current', null);
  $('setup').hidden = false; $('view').hidden = true;
  document.body.classList.remove('nav');
  document.title = MODE.title;
  markActive();
  $('opener').focus();
}

async function start() {
  const opener = $('opener').value;
  if (!opener.trim() && KIND !== 'puzzle') return msg('Empty opener.', true);
  const agents = [$('a').value, $('b').value];
  store.set('pair', agents); store.set('turns', $('turns').value);
  $('start').disabled = true;
  try {
    const t = await api('/api/talk', { kind: KIND, opener, agents, turns: Number($('turns').value), files: await encode('opener') });
    msg('');
    $('opener').value = '';
    picked.opener = []; chips('opener');
    await refreshTalks();
    show(t.id);
  } catch (e) { msg(e.message, true); }
  finally { $('start').disabled = false; }
}

async function act(path, body) {
  try { await api(path, { id: current, ...body }); show(current); }
  catch (e) { $('status').insertAdjacentHTML('beforeend', `\n<span class="err">${esc(e.message)}</span>`); }
}

async function say() {
  const text = $('say').value;
  if (!text.trim() && !picked.say.length) return;
  $('send').disabled = true;
  try {
    await api('/api/talk/say', { id: current, text, files: await encode('say') });
    $('say').value = '';
    picked.say = []; chips('say');
    show(current);
  } catch (e) { $('status').insertAdjacentHTML('beforeend', `\n<span class="err">${esc(e.message)}</span>`); }
  finally { $('send').disabled = false; }
}

async function copy() {
  if (!last) return;
  try { await navigator.clipboard.writeText(transcript(last)); $('copy').textContent = 'Copied'; }
  catch { $('copy').textContent = 'Copy failed'; }
  setTimeout(() => { $('copy').textContent = 'Copy transcript'; }, 1500);
}

function markActive() {
  for (const el of $('talks').querySelectorAll('.talk')) el.classList.toggle('on', el.dataset.id === current);
}

async function refreshTalks() {
  let talks;
  try { ({ talks } = await api('/api/talks')); } catch { return; }
  $('clear').hidden = !talks.some(t => t.status !== 'running');
  talks = talks.filter(t => (t.kind || 'talk') === KIND);
  if (!talks.length) { $('talks').innerHTML = `<div class="hint">${esc(MODE.none)}</div>`; return; }
  $('talks').innerHTML = talks.map(t => `
    <div class="talk" data-id="${esc(t.id)}" title="${esc(t.status)} · ${t.turns} turns">
      <div class="t1"><span class="dot ${esc(t.status)}"></span>${esc(t.agents.join(' ↔ '))}</div>
      <div class="t2">${esc(t.opener)}</div>
    </div>`).join('');
  markActive();
}

async function clearTalks() {
  try {
    const r = await api('/api/talks/clear', {});
    $('saved').textContent = `Saved ${r.saved.length} to ${r.dir}` + (r.running ? ` · ${r.running} still running` : '');
    if (current && !(await api('/api/talks')).talks.some(t => t.id === current)) showSetup();
    refreshTalks();
  } catch (e) { $('saved').textContent = e.message; }
}

$('clear').addEventListener('click', clearTalks);
$('talks').addEventListener('click', e => { const el = e.target.closest('.talk'); if (el) show(el.dataset.id); });
$('start').addEventListener('click', start);
$('swap').addEventListener('click', () => { const a = $('a').value; $('a').value = $('b').value; $('b').value = a; });
$('new').addEventListener('click', showSetup);
for (const b of document.querySelectorAll('#attachOpener, #attachSay')) b.addEventListener('click', () => {
  picking = b.dataset.for;
  $('pick').accept = ACCEPT.split(' ').map(e => '.' + e).join(',');
  $('pick').click();
});
$('pick').addEventListener('change', () => {
  picked[picking].push(...$('pick').files);
  picked[picking] = picked[picking].slice(0, 5);
  $('pick').value = '';
  chips(picking);
});
for (const id of ['openerFiles', 'sayFiles']) $(id).addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { picked[b.dataset.for].splice(Number(b.dataset.i), 1); chips(b.dataset.for); }
});
$('send').addEventListener('click', say);
$('copy').addEventListener('click', copy);
$('say').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); say(); } });
$('stop').addEventListener('click', () => act('/api/talk/stop'));
$('resume').addEventListener('click', () => act('/api/talk/resume', { turns: Number($('moreTurns').value) }));
for (const b of document.querySelectorAll('.menu')) b.addEventListener('click', () => document.body.classList.toggle('nav'));
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !$('setup').hidden) { e.preventDefault(); start(); }
});

for (const a of document.querySelectorAll('.modes a')) if (a.dataset.kind === KIND) { a.classList.add('on'); a.setAttribute('aria-current', 'page'); }
$('h1').textContent = MODE.h1;
$('new').textContent = '+ ' + MODE.h1;
$('firstLabel').textContent = MODE.first; $('secondLabel').textContent = MODE.second;
$('countLabel').textContent = MODE.count;
$('opener').placeholder = MODE.placeholder;
Object.assign($('turns'), { min: MODE.min, max: MODE.max });
$('moreTurns').setAttribute('aria-label', `More ${MODE.count.toLowerCase()}`);

(async () => {
  try {
    const { agents } = await api('/api/agents');
    const usable = agents.filter(a => a.modes.includes('background'));
    const options = usable.map(a => `<option value="${esc(a.id)}" ${a.available ? '' : 'disabled'}>${esc(a.label)}${a.available ? '' : ' (not found)'}</option>`).join('');
    $('a').innerHTML = $('b').innerHTML = options;
    const ok = usable.filter(a => a.available).map(a => a.id);
    const [pa, pb] = store.get('pair', []);
    $('a').value = ok.includes(pa) ? pa : ok[0] || '';
    $('b').value = ok.includes(pb) ? pb : ok.find(id => id !== $('a').value) || ok[0] || '';
    $('turns').value = store.get('turns', MODE.turns);
    await refreshTalks();
    const id = store.get('current', null);
    id ? show(id) : showSetup();
  } catch (e) { msg(e.message, true); }
})();
</script>
</body>
</html>
